name: pilotiq
description: Application for preparation to theoretical exam on PPL at Polish ULC.

publish_to: 'none'

version: 1.2.0+12

environment:
  sdk: '>=2.19.4 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.3.0
  font_awesome_flutter: 10.4.0
  google_fonts: 4.0.3
  hive_flutter: ^1.1.0
  intl: 0.17.0
  json_annotation: 4.8.0
  linkfive_purchases: ^2.1.3
  linkfive_purchases_provider: 2.1.3
  percent_indicator: 4.2.3
  package_info_plus: ^1.4.2
  in_app_purchases_paywall_ui: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.12.0"
  flutter_lints: ^2.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/covers/
    - assets/data/
    - assets/icon/

