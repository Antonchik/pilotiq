name: ulc_exam_simulator
description: Application for preparation to theoretical exam on PPL at Polish ULC.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.4 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.3.0
  font_awesome_flutter: 10.4.0
  google_fonts: 4.0.3
  intl: 0.17.0
  json_annotation: 4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/covers/
    - assets/data/

