name: pilotiq
description: Application for preparation to theoretical exam on PPL at Polish ULC.

publish_to: 'none'

version: 1.2.0+14

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.1
  flutter_local_notifications: ^23.0.0
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  hive_ce: ^2.24.0
  hive_ce_flutter: ^2.6.0
  intl: any
  package_info_plus: ^10.0.0
  percent_indicator: ^4.2.5
  purchases_flutter: ^11.0.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^6.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true

  generate: true

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

  assets:
    - assets/covers/
    - assets/data/
    - assets/icon/

